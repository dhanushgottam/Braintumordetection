<!DOCTYPE html>
<html>

<head>

    <title>Prediction Result</title>

    <link 
        rel="stylesheet" 
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <div class="container">

        <h1>Prediction Result</h1>

        <img 
            src="{{ image_path }}" 
            width="300"
        >

        <h2>{{ prediction }}</h2>

        <h3>
            Confidence: {{ confidence }}%
        </h3>

        <br>

        <a href="/">
            Upload Another Image
        </a>

    </div>

</body>

</html>
